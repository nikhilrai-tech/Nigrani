{{- if and (not .Values.demo) (not .Values.auth.existingSecret) }}
{{- $name := include "nigrani.fullname" . }}
{{- /* keep the same password on upgrade: reuse the generated one if the Secret already exists */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.auth.password }}
{{- if and (not $password) $existing }}{{ $password = index $existing.data "NIGRANI_PASSWORD" | b64dec }}{{ end }}
{{- if not $password }}{{ $password = randAlphaNum 24 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nigrani.labels" . | nindent 4 }}
type: Opaque
data:
  NIGRANI_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
