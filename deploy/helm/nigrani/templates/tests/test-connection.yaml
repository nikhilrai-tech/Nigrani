apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nigrani.fullname" . }}-test"
  labels:
    {{- include "nigrani.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command: [python, -c]
      args:
        - |
          import json, urllib.request
          d = json.load(urllib.request.urlopen("http://{{ include "nigrani.fullname" . }}:{{ .Values.service.port }}/api/health", timeout=10))
          assert d["ok"], d
          print("Nigrani answered:", d)
