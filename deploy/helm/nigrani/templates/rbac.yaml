{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nigrani.fullname" . }}
  labels:
    {{- include "nigrani.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nigrani.fullname" . }}
  labels:
    {{- include "nigrani.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nigrani.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nigrani.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
