apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nigrani.fullname" . }}
  labels:
    {{- include "nigrani.labels" . | nindent 4 }}
spec:
  replicas: 1                          # one SQLite file: never more than one pod
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nigrani.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nigrani.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nigrani.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.rbac.create }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: nigrani
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NIGRANI_CONFIG
              value: /config/nigrani.yaml
            {{- if .Values.demo }}
            - name: NIGRANI_DEMO
              value: "1"
            {{- else }}
            - name: NIGRANI_USERNAME
              value: {{ .Values.auth.username | quote }}
            - name: NIGRANI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nigrani.secretName" . }}
                  key: {{ include "nigrani.secretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config/nigrani.yaml
              subPath: nigrani.yaml
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "nigrani.fullname" . }}
        - name: data
          {{- if and .Values.persistence.enabled (not .Values.demo) }}
          persistentVolumeClaim:
            claimName: {{ include "nigrani.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
