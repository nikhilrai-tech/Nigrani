version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    # requirements.txt holds compatibility ranges (>=floor,<next-major), not pins: only widen/raise them
    # when a new release actually needs it, instead of opening a PR for every minor release.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      react:                    # react and react-dom must move together, or `npm ci` fails on a peer conflict
        patterns: ["react", "react-dom"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
