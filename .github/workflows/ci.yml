name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with: { src: backend }

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: helm lint deploy/helm/nigrani
      - run: helm template r deploy/helm/nigrani --set rbac.create=true --set ingress.enabled=true > /dev/null
      - run: helm template r deploy/helm/nigrani --set demo=true --set persistence.enabled=false > /dev/null
      - name: Chart appVersion matches the code version
        run: |
          v=$(PYTHONPATH=backend python3 -c 'from nigrani import __version__; print(__version__)')
          grep -q "^appVersion: \"$v\"" deploy/helm/nigrani/Chart.yaml || { echo "Chart.yaml appVersion must be $v"; exit 1; }

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t nigrani:ci .
