name: Release
# Pushing a tag like v0.1.0 verifies the tag matches the code version, builds a multi-arch image,
# pushes it to ghcr.io and creates a GitHub release with generated notes.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tag matches the version in the code
        run: |
          version="v$(PYTHONPATH=backend python -c 'from nigrani import __version__; print(__version__)')"
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != code version $version"; exit 1; }
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: backend

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40         # a stuck multi-arch build fails in minutes, not after the 6 hour default; re-run the job
    permissions:
      contents: write     # create the GitHub release
      packages: write     # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nigrani
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
